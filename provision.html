<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ScreensWeb Agent · Vincular equipo</title>
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/provision.css">
</head>

<body>
  <div class="window">
    <div class="title-bar">
        <span class="title-bar-text">
            <span class="title-bar-logo" aria-hidden="true">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M12 17v4"></path><path d="M8 21h8"></path></svg>
            </span>
            ScreensWeb Agent
        </span>
        <div class="title-bar-controls">
            <button class="title-bar-button" id="btn-minimize" aria-label="Minimizar">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <button class="title-bar-button close" id="btn-close" aria-label="Cerrar">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
            </button>
        </div>
    </div>

    <main class="content">
        <form class="panel" id="form" novalidate>
            <div class="header">
                <div class="header-icon" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"></path><path d="M15 7h2a5 5 0 1 1 0 10h-2"></path><path d="M8 12h8"></path></svg>
                </div>
                <h1>Vincular este equipo</h1>
            </div>

            <div class="fields">
                <label class="field">
                    <span>Servidor</span>
                    <input class="input" id="serverUrl" type="url" autocomplete="off" spellcheck="false">
                </label>
                <label class="field">
                    <span>Código de configuración</span>
                    <input class="input mono" id="nonceInput" type="text" autocomplete="off" spellcheck="false">
                </label>
            </div>

            <div class="alert" id="alert" role="alert" hidden>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
                <span id="alert-text"></span>
            </div>

            <button type="submit" class="btn-primary" id="connectBtn">
                <svg class="spinner" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
                <span id="connectLabel">Conectar</span>
            </button>
        </form>

        <!-- Connected: the device is linked from the panel by this ID. -->
        <div class="panel centered" id="waiting" role="status" hidden>
            <div class="badge-icon" aria-hidden="true">
                <svg class="spinner" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.22-8.56"></path></svg>
            </div>
            <div class="stack">
                <h1>Esperando vinculación</h1>
                <span class="muted">Vincula este equipo desde el panel con su ID.</span>
            </div>
            <div class="device-id mono" id="deviceId"></div>
        </div>

        <div class="panel centered" id="done" role="status" hidden>
            <div class="badge-icon ok" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>
            </div>
            <div class="stack">
                <h1>Equipo vinculado</h1>
                <span class="muted">Abriendo el panel de control…</span>
            </div>
        </div>
    </main>

    <footer class="footer">
        <span>ScreensWeb Agent © <span id="current-year"></span></span>
    </footer>
  </div>
  <script src="./js/provision.js"></script>
</body>

</html>

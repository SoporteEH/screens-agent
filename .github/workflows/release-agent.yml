name: Release Local Agent

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] # ubuntu-latest
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Validate SERVER_URL
        shell: bash
        env:
          SERVER_URL: ${{ vars.SERVER_URL || secrets.SERVER_URL }}
          ALLOW_PRIVATE_SERVER_URL: ${{ vars.ALLOW_PRIVATE_SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::SERVER_URL is not set. Define it under Settings → Secrets and variables → Actions, as a secret (preferred) or a repository variable."
            exit 1
          fi

          host=$(printf '%s' "$SERVER_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          reachable_only_on_lan=false
          case "$host" in
            localhost|127.*|10.*|192.168.*) reachable_only_on_lan=true ;;
            172.1[6-9].*|172.2[0-9].*|172.3[01].*) reachable_only_on_lan=true ;;
          esac
          case "$SERVER_URL" in http://*) plain_http=true ;; *) plain_http=false ;; esac
          case "$GITHUB_REF_NAME" in *-beta*) prerelease=true ;; *) prerelease=false ;; esac

          if [ "$reachable_only_on_lan" = true ] || [ "$plain_http" = true ]; then
            if [ "$prerelease" = true ]; then
              echo "::warning::SERVER_URL points at $host over plain HTTP or a private range. Fine for this beta tag; agents built here only work on that network."
            elif [ "$ALLOW_PRIVATE_SERVER_URL" = "true" ]; then
              echo "::warning::Stable $GITHUB_REF_NAME built against $host because ALLOW_PRIVATE_SERVER_URL is set. Every agent installed from this release only works on that network — delete the variable before the first production release."
            else
              echo "::error::Refusing to cut stable $GITHUB_REF_NAME with SERVER_URL=$host — it is a private address or plain HTTP, and gets baked into every agent. Tag it as vX.Y.Z-beta.N to test, or set the ALLOW_PRIVATE_SERVER_URL variable to true if the production backend really lives inside the tunnel."
              exit 1
            fi
          fi

          echo "SERVER_URL=$SERVER_URL" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Player wrapper contract check
        run: node scripts/check-player-contract.js

      # The tag is the source of truth for the version
      - name: Set version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N. A prerelease needs the trailing number (v1.2.3-beta.1, not v1.2.3-beta) or the channel cannot be derived."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          ' "$version"
          echo "Building $version from tag $GITHUB_REF_NAME"

      - name: Inject Configuration
        run: node scripts/inject-config.js

      # Run before any build / decides beta.yml vs latest.yml
      - name: Set publish channel from version
        run: node scripts/set-release-channel.js

      - name: Build (Windows, no publish)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Smoke test the built binary
        if: matrix.os == 'windows-latest'
        run: node scripts/smoke-test.js

      # Created up front
      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          case "$version" in *-beta*) pre=true ;; *) pre=false ;; esac

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=$pre
          else
            flags=""
            [ "$pre" = true ] && flags="--prerelease"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$version" --notes "$version" $flags
          fi

      - name: Build and Release (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build and Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux deb AppImage --arm64 --armv7l --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

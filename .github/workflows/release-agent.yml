name: Release Local Agent

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] # ubuntu-latest
    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Validate SERVER_URL
        shell: bash
        env:
          SERVER_URL: ${{ vars.SERVER_URL || secrets.SERVER_URL }}
          ALLOW_PRIVATE_SERVER_URL: ${{ vars.ALLOW_PRIVATE_SERVER_URL }}
        run: |
          if [ -z "$SERVER_URL" ]; then
            echo "::error::SERVER_URL is not set. Define it under Settings → Secrets and variables → Actions, as a secret (preferred) or a repository variable."
            exit 1
          fi

          host=$(printf '%s' "$SERVER_URL" | sed -E 's#^[a-zA-Z]+://##; s#[:/].*$##')
          reachable_only_on_lan=false
          case "$host" in
            localhost|127.*|10.*|192.168.*) reachable_only_on_lan=true ;;
            172.1[6-9].*|172.2[0-9].*|172.3[01].*) reachable_only_on_lan=true ;;
          esac
          case "$SERVER_URL" in http://*) plain_http=true ;; *) plain_http=false ;; esac
          case "$GITHUB_REF_NAME" in *-beta*) prerelease=true ;; *) prerelease=false ;; esac

          if [ "$reachable_only_on_lan" = true ] || [ "$plain_http" = true ]; then
            if [ "$prerelease" = true ]; then
              echo "::warning::SERVER_URL points at $host over plain HTTP or a private range. Fine for this beta tag; agents built here only work on that network."
            elif [ "$ALLOW_PRIVATE_SERVER_URL" = "true" ]; then
              echo "::warning::Stable $GITHUB_REF_NAME built against $host because ALLOW_PRIVATE_SERVER_URL is set. Every agent installed from this release only works on that network — delete the variable before the first production release."
            else
              echo "::error::Refusing to cut stable $GITHUB_REF_NAME with SERVER_URL=$host — it is a private address or plain HTTP, and gets baked into every agent. Tag it as vX.Y.Z-beta.N to test, or set the ALLOW_PRIVATE_SERVER_URL variable to true if the production backend really lives inside the tunnel."
              exit 1
            fi
          fi

          echo "SERVER_URL=$SERVER_URL" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check version matches tag
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but package.json is $version. They must match — tag v$version, or set the version to ${GITHUB_REF_NAME#v}."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Configuration
        run: node scripts/inject-config.js

      # Must run before any build: it decides beta.yml vs latest.yml and whether the
      # release is a prerelease, both of which electron-builder gets wrong by default.
      - name: Set publish channel from version
        run: node scripts/set-release-channel.js

      - name: Build (Windows, no publish)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      - name: Smoke test the built binary
        if: matrix.os == 'windows-latest'
        run: node scripts/smoke-test.js

      - name: Build and Release (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Build and Release (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux deb AppImage --arm64 --armv7l --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
